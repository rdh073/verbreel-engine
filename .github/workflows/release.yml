name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  verify:
    name: release verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: conformance
        run: cargo run -p verbreel-conformance --release

  render-smoke:
    name: native render smoke
    # ubuntu-24.04, NOT 22.04: the example links rsmpeg, whose rusty_ffmpeg
    # build script is pinned to the `ffmpeg6` ABI. 22.04's apt libav* is
    # FFmpeg 4.4 (libavcodec 58), an ABI mismatch that aborts the build with
    # `avdevice not found!` at the static pkg-config probe. 24.04 ships
    # FFmpeg 6.1.1 (libavcodec 60) via plain apt, satisfying `ffmpeg6`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-render-smoke
      - name: Install FFmpeg and software Vulkan prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libavdevice-dev libavfilter-dev libswscale-dev \
            libswresample-dev libpostproc-dev \
            mesa-vulkan-drivers
      - name: drop Libs.private from FFmpeg .pc files
        # rusty_ffmpeg probes its hardcoded 7-lib set (incl. libavdevice) with
        # pkg-config in `--static` mode. Static mode concatenates each .pc's
        # `Libs.private`, which for libavdevice lists the full capture/render
        # backend chain (raw1394, jack, SDL2, alsa, GL, pulse, …). Ubuntu ships
        # libav* as dynamic .so only, so those backend -dev packages are absent
        # and the probe fails. The .so resolves its own deps, so for a dynamic
        # link the Libs.private chain is spurious — strip it so the static
        # probe returns just the FFmpeg libs Ubuntu actually provides.
        run: |
          pcdir=$(pkg-config --variable=pcfiledir libavcodec)
          sudo sed -i '/^Libs.private:/d' \
            "$pcdir"/lib{avcodec,avformat,avutil,avdevice,avfilter,swscale,swresample,postproc}.pc
      - name: Render example
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          WGPU_BACKEND: vulkan
        run: cargo run -p examples --features native-render

  package-cli:
    name: package CLI (${{ matrix.os }})
    needs: [verify, render-smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, NOT 22.04: verbreel-cli --features native-render links
        # rsmpeg through the same `ffmpeg6`-pinned static pkg-config probe the
        # render-smoke job hits. 22.04's apt libav* is FFmpeg 4.4 (libavcodec
        # 58), an ABI mismatch; 24.04 ships FFmpeg 6.1.1 (libavcodec 60).
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-${{ matrix.os }}
      - name: Install native render prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              pkg-config libclang-dev \
              libavcodec-dev libavformat-dev libavutil-dev \
              libavdevice-dev libavfilter-dev libswscale-dev \
              libswresample-dev libpostproc-dev
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg llvm pkg-config
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          fi
      - name: drop Libs.private from FFmpeg .pc files
        # Same rusty_ffmpeg static-probe issue as render-smoke: the hardcoded
        # 7-lib `--static` probe concatenates each .pc's Libs.private, which for
        # libavdevice lists capture/render backends (raw1394, jack, SDL2, alsa,
        # GL, pulse, …) whose -dev packages aren't installed. Ubuntu ships
        # libav* as dynamic .so only, so the .so resolves its own deps and the
        # Libs.private chain is spurious for a dynamic link — strip it. Linux
        # only; macOS Homebrew ffmpeg installs full deps and needs no strip.
        if: runner.os == 'Linux'
        run: |
          pcdir=$(pkg-config --variable=pcfiledir libavcodec)
          sudo sed -i '/^Libs.private:/d' \
            "$pcdir"/lib{avcodec,avformat,avutil,avdevice,avfilter,swscale,swresample,postproc}.pc
      - name: Build CLI
        run: cargo build --release -p verbreel-cli --features native-render
      - name: Package CLI
        shell: bash
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          asset="verbreel-${GITHUB_REF_NAME}-${os}-${arch}"
          mkdir -p "dist/${asset}"
          cp target/release/verbreel "dist/${asset}/verbreel"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: verbreel-cli-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: [package-cli]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify annotated tag
        shell: bash
        run: |
          set -euo pipefail
          tag_type="$(git cat-file -t "${GITHUB_REF_NAME}")"
          if [ "$tag_type" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} must be an annotated tag"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: verbreel-cli-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            dist/*.tar.gz \
            dist/*.sha256
