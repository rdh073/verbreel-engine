name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  verify:
    name: release verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: conformance
        run: cargo run -p verbreel-conformance --release

  render-smoke:
    name: native render smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-render-smoke
      - name: Install FFmpeg and software Vulkan prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libclang-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            mesa-vulkan-drivers
      - name: Render example
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          WGPU_BACKEND: vulkan
        run: cargo run -p examples --features native-render

  package-cli:
    name: package CLI (${{ matrix.os }})
    needs: [verify, render-smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-${{ matrix.os }}
      - name: Install native render prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y \
              pkg-config libclang-dev \
              libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg llvm pkg-config
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          fi
      - name: Build CLI
        run: cargo build --release -p verbreel-cli --features native-render
      - name: Package CLI
        shell: bash
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          asset="verbreel-${GITHUB_REF_NAME}-${os}-${arch}"
          mkdir -p "dist/${asset}"
          cp target/release/verbreel "dist/${asset}/verbreel"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: verbreel-cli-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: [package-cli]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify annotated tag
        shell: bash
        run: |
          set -euo pipefail
          tag_type="$(git cat-file -t "${GITHUB_REF_NAME}")"
          if [ "$tag_type" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} must be an annotated tag"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: verbreel-cli-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            dist/*.tar.gz \
            dist/*.sha256
