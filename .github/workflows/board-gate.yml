name: board-gate

on:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  linked-issue-in-review:
    runs-on: ubuntu-latest
    steps:
      - name: Verify linked issue board status
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          REPO_OWNER: rdh073
          PROJECT_OWNER: rdh073
          REPO: verbreel-engine
          PROJECT_NUMBER: "3"
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_PROJECT_TOKEN secret is required to read user ProjectV2 #${PROJECT_NUMBER}" >&2
            exit 1
          fi

          : > /tmp/closing-issues.txt
          after=""
          while :; do
            args=(
              -f owner="$REPO_OWNER"
              -f repo="$REPO"
              -F number="$PR_NUMBER"
            )
            if [ -n "$after" ]; then
              args+=(-F after="$after")
            fi

            gh api graphql "${args[@]}" \
              -f query='
                query($owner: String!, $repo: String!, $number: Int!, $after: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 100, after: $after) {
                        nodes { number url }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }' > /tmp/pr-page.json

            jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[].url' /tmp/pr-page.json >> /tmp/closing-issues.txt
            has_next=$(jq -r '.data.repository.pullRequest.closingIssuesReferences.pageInfo.hasNextPage' /tmp/pr-page.json)
            if [ "$has_next" != "true" ]; then
              break
            fi
            after=$(jq -r '.data.repository.pullRequest.closingIssuesReferences.pageInfo.endCursor' /tmp/pr-page.json)
          done

          test -s /tmp/closing-issues.txt

          gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json --limit 1000 > /tmp/project.json

          while IFS= read -r issue_url; do
            status=$(jq -r --arg url "$issue_url" \
              'first(
                .items[]
                | select(.content.url==$url)
                | (.status // (.fieldValues[]? | select(.field.name=="Status").name))
              ) // ""' /tmp/project.json)
            if [ -z "$status" ]; then
              echo "linked issue ${issue_url} is missing from project #${PROJECT_NUMBER}" >&2
              exit 1
            fi
            if [ "$status" != "In review" ] && [ "$status" != "In Review" ]; then
              echo "linked issue ${issue_url} must be In Review in project #${PROJECT_NUMBER}; got '${status:-missing}'" >&2
              exit 1
            fi
          done < /tmp/closing-issues.txt
