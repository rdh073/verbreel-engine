# PR-Agent — OpenAI-powered AI reviewer (gemini-code-assist-like).
#
# Runs on every PR open/sync and on issue/review comments so users can call
# slash-commands: /review, /improve, /describe, /ask <q>, /help.
#
# Requires repository secret: OPENAI_KEY (sk-proj-... or sk-...).
# Model: openai/gpt-5.5 with reasoning=medium; falls back to gpt-5 → gpt-5-mini.
#
# Bot-PR handling:
#   - github.event.sender.type != 'Bot'  → skip auto-review on bot PRs.
#   - label `skip-ai-review`              → manual opt-out per PR.
#   - label `needs-ai-review` on bot PRs → manual opt-in (sender check bypass via comment trigger).

name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  pr_agent_job:
    if: |
      github.event.sender.type != 'Bot' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')
    runs-on: ubuntu-latest
    name: PR-Agent review
    steps:
      - name: PR-Agent action
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI_KEY:   ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── Model: flagship + fallback chain ──
          config.model:            "openai/gpt-5.5"
          config.fallback_models:  '["openai/gpt-5", "openai/gpt-5-mini"]'
          config.reasoning_effort:      "medium"
          config.custom_model_max_tokens: "128000"  # PR-Agent MAX_TOKENS table miss workaround for gpt-5 family
          config.temperature:             "1"       # gpt-5 family only supports temperature=1 (litellm UnsupportedParamsError otherwise)

          # ── Auto-run on PR open/sync ──
          github_action_config.auto_review:   "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve:  "true"

          # ── Trim noise (drop score/effort blocks; keep tests+security) ──
          pr_reviewer.require_score_review:              "false"
          pr_reviewer.require_estimate_effort_to_review: "false"
          pr_reviewer.require_tests_review:              "true"
          pr_reviewer.require_security_review:           "true"

          # ── Verbreel verb-slice review rules (ported from executor_lessons) ──
          pr_reviewer.extra_instructions: |
            Verbreel verb-slice review checklist:
            - Destructive verbs MUST emit W_<VERB>_ENVELOPE warning carrying pre-state-only data
              (canonical pattern: keyframe.remove). Flag if missing.
            - State invariants: time monotonic, no overlap unless ripple-shifted, asset ref counts balanced.
            - JCS canon: use to_canon_bytes_from_slice(&[u8]); NOT to_vec(value).
            - Verb args: TrackId::try_from(String) doesn't exist — use args.track.parse::<TrackId>().
            - All E_* error codes must have >=1 unit test exercising the error path.
            - Reconstructor MUST round-trip pre-state -> verb -> post-state -> reconstructed pre-state.
            - Tick math: TICK_RATE_HZ=240000; all time conversions go through Tick newtype.
            - Public fns returning Result need /// # Errors doc-comment (clippy::missing_errors_doc).
            - Wrap UUIDv7/SHA256/JCS/clippy references in backticks (clippy::doc_markdown).

          pr_code_suggestions.extra_instructions: |
            - Suggest /// # Errors doc-comment for any pub fn returning Result.
            - Suggest backticks for UUIDv7/SHA256/JCS/clippy refs (clippy::doc_markdown).
            - Don't suggest renaming verb fns or args — names mirror spec §X.Y exactly.
            - Don't suggest replacing serde derive (#[serde(transparent)] caveat).
          pr_code_suggestions.num_code_suggestions:        "6"
          pr_code_suggestions.suggestions_score_threshold: "7"

          # ── Auto-commit suggestions above the score threshold ──
          # When true, PR-Agent commits each /improve suggestion that clears
          # `suggestions_score_threshold` directly to the PR branch as a new
          # commit. Trade-off: removes the manual-review gate on suggestions.
          # Threshold is set to 7 above, so only high-confidence suggestions
          # auto-commit; the `extra_instructions` guardrails further filter
          # out the "don't suggest" patterns that would otherwise churn.
          pr_code_suggestions.commit_changes_to_pr: "true"
