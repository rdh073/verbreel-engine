name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: cargo check (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        rust: [stable, "1.92"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-targets

  fmt:
    name: cargo fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wasm-check:
    name: cargo check wasm32
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-check
      # Per-crate (not `cargo check --workspace --target wasm32-...`) because
      # the workspace contains native-only crates (rsmpeg, tokio, axum...).
      # Whitelist explicit wasm-safe crates; new wasm-safe crates must be
      # explicitly added here when they land.
      - name: cargo check wasm32 — verbreel-types
        run: cargo check -p verbreel-types --target wasm32-unknown-unknown --lib
      - name: cargo check wasm32 — verbreel-canon
        run: cargo check -p verbreel-canon --target wasm32-unknown-unknown --lib
      # events: `--no-default-features` disables `native` (which gates fs4 +
      # parking_lot). The trait + event types surface MUST compile to wasm32;
      # the concrete OPFS backend lands in Phase 2.
      - name: cargo check wasm32 — verbreel-events (no-default-features)
        run: cargo check -p verbreel-events --target wasm32-unknown-unknown --lib --no-default-features
      - name: cargo check wasm32 — verbreel-wasm
        run: cargo check -p verbreel-wasm --target wasm32-unknown-unknown --lib
