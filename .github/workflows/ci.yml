name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: cargo check (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        rust: [stable, "1.92"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-targets

  fmt:
    name: cargo fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  conformance:
    name: conformance (Research 06 Layer 3)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Release-mode so behaviour matches the deployed binary. The
      # reconstructor-identity check is fast (<1s for the current
      # 121-verb / 121-fixture set); no caching of the report itself.
      - run: cargo run -p verbreel-conformance --release

  ffmpeg:
    name: cargo test/clippy codec-native (rsmpeg feature-on)
    # ubuntu-24.04, NOT 22.04: rsmpeg is pinned to the `ffmpeg6` ABI, and
    # 22.04's apt libav* is FFmpeg 4.4 (libavcodec 58) — an ABI mismatch
    # that fails rsmpeg's bindgen. 24.04 ships FFmpeg 6.1.1 (libavcodec 60)
    # via plain apt, satisfying `ffmpeg6` with no PPA or source build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: install system FFmpeg 6.x dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev \
            libavdevice-dev libswscale-dev pkg-config libclang-dev
      - name: drop Libs.private from FFmpeg .pc files
        # rusty_ffmpeg's build script (link_system_ffmpeg) probes its
        # hardcoded 7-lib set — including libavdevice — with pkg-config in
        # `--static` mode (it always passes .statik(true); no env overrides
        # that). Static mode concatenates each .pc's `Libs.private`, which
        # for libavdevice lists the full capture/render backend chain
        # (raw1394, jack, SDL2, alsa, GL, pulse, …). Ubuntu ships libav* as
        # dynamic .so only, so those backend -dev packages are absent and
        # rust-lld fails with `unable to find library -lraw1394` etc. The
        # .so already resolves its own deps, so for a dynamic link the
        # Libs.private chain is spurious — strip it so the static probe
        # returns just the FFmpeg libs Ubuntu actually provides.
        run: |
          pcdir=$(pkg-config --variable=pcfiledir libavcodec)
          sudo sed -i '/^Libs.private:/d' \
            "$pcdir"/lib{avcodec,avformat,avutil,avdevice,avfilter,swscale,swresample,postproc}.pc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffmpeg
      - name: cargo test (rsmpeg feature-on)
        run: cargo test -p verbreel-codec-native --features rsmpeg
      - name: cargo clippy (rsmpeg feature-on)
        run: cargo clippy -p verbreel-codec-native --features rsmpeg -- -D warnings

  wasm-check:
    name: cargo check wasm32
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-check
      # Per-crate (not `cargo check --workspace --target wasm32-...`) because
      # the workspace contains native-only crates (rsmpeg, tokio, axum...).
      # Whitelist explicit wasm-safe crates; new wasm-safe crates must be
      # explicitly added here when they land.
      - name: cargo check wasm32 — verbreel-types
        run: cargo check -p verbreel-types --target wasm32-unknown-unknown --lib
      - name: cargo check wasm32 — verbreel-canon
        run: cargo check -p verbreel-canon --target wasm32-unknown-unknown --lib
      # events: `--no-default-features` disables `native` (which gates fs4 +
      # parking_lot). The trait + event types surface MUST compile to wasm32;
      # the concrete OPFS backend lands in Phase 2.
      - name: cargo check wasm32 — verbreel-events (no-default-features)
        run: cargo check -p verbreel-events --target wasm32-unknown-unknown --lib --no-default-features
      # verbreel-wasm now depends on verbreel-codec-web (the preview-session
      # bridge), so building it for wasm32 transitively compiles codec-web's
      # WebCodecs bindings and therefore ALSO needs `--cfg=web_sys_unstable_apis`.
      # The job-level `RUSTFLAGS` env fully overrides `.cargo/config.toml`'s
      # target rustflags, so the cfg is set explicitly here (config.toml still
      # covers local dev where RUSTFLAGS is unset). `--all-targets` exercises
      # the wasm32 smoke harness.
      - name: cargo check wasm32 — verbreel-wasm
        run: cargo check -p verbreel-wasm --target wasm32-unknown-unknown --all-targets
        env:
          RUSTFLAGS: "-D warnings --cfg=web_sys_unstable_apis"
      # codec-web's WebCodecs bindings (VideoDecoder / EncodedVideoChunk /
      # VideoFrame) are still unstable in web-sys 0.3, so the wasm32 build
      # needs `--cfg=web_sys_unstable_apis`. The job-level `RUSTFLAGS` env
      # fully overrides `.cargo/config.toml`'s target rustflags, so the cfg
      # is appended explicitly here (config.toml still covers local dev where
      # RUSTFLAGS is unset). `--all-targets` exercises the wasm32 smoke tests.
      - name: cargo check wasm32 — verbreel-codec-web
        run: cargo check -p verbreel-codec-web --target wasm32-unknown-unknown --all-targets
        env:
          RUSTFLAGS: "-D warnings --cfg=web_sys_unstable_apis"
