[package]
name = "verbreel-wasm"
description = "wasm-bindgen crate for browser preview."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "verbreel_wasm"

[dependencies]
# verbreel-state's `native` feature gates the fs4-backed event backend, which
# is incompatible with wasm32. We pull state without defaults; native callers
# in the workspace (verbreel-cli/mcp/http) still pull `native` so the unified
# `cargo check --workspace` build keeps the native backend included.
verbreel-state = { path = "../verbreel-state", default-features = false }
verbreel-ir = { path = "../verbreel-ir" }
# codec-web is the preview decode boundary the EngineHandle bridges to. Its
# browser deps (web-sys/js-sys) live under its own wasm32 target-cfg block, so
# pulling it here adds nothing to the native `cargo check --workspace` build;
# the native surface is the pure transport/handshake logic.
verbreel-codec-web = { path = "../verbreel-codec-web" }
wgpu.workspace = true
tracing.workspace = true
thiserror.workspace = true
wasm-bindgen = "0.2"

# Browser-only deps. The preview-session bridge drives codec-web's async
# WebCodecs decode loop (wasm-bindgen-futures), and dev diagnostics install a
# panic hook (console_error_panic_hook). Gated to wasm32 so the native
# `cargo check --workspace` build pulls no browser toolchain.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-tracing = "2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
