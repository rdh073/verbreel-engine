[package]
name = "verbreel-cli"
description = "CLI binary — clap derive."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "verbreel_cli"
path = "src/lib.rs"

[[bin]]
name = "verbreel_cli"
path = "src/main.rs"

[features]
default = []
# Forward the live Anthropic planner so `verbreel edit --intent "…"` can
# turn natural language into a verb plan. Off by default — `edit --plan
# <file>` and every other subcommand work without it (no network stack).
claude = ["verbreel-agent/claude"]

[dependencies]
verbreel-agent = { path = "../verbreel-agent" }
verbreel-state = { path = "../verbreel-state" }
verbreel-storage = { path = "../verbreel-storage" }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
