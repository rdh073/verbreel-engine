[package]
name = "verbreel-cli"
description = "CLI binary — clap derive."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "verbreel_cli"
path = "src/lib.rs"

[[bin]]
name = "verbreel"
path = "src/main.rs"

[dependencies]
verbreel-state = { path = "../verbreel-state" }
verbreel-storage = { path = "../verbreel-storage" }
verbreel-runtime = { path = "../verbreel-runtime", optional = true }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[features]
default = []
native-render = [
    "dep:verbreel-runtime",
    "verbreel-runtime/native-render",
]

[dev-dependencies]
tempfile.workspace = true
