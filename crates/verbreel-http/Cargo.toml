[package]
name = "verbreel-http"
description = "HTTP server — axum 0.8."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "verbreel_http"
path = "src/lib.rs"

[[bin]]
name = "verbreel-http"
path = "src/main.rs"

[features]
default = []
# Forward the live Claude planner so `POST /projects/{name}/agent` can
# turn an intent into a plan. Off by default (no network stack).
claude = ["verbreel-agent/claude"]
# Route `render.start` to verbreel-runtime for an actual pixel encode.
# Off by default — heavy GPU/FFmpeg deps.
native-render = [
    "dep:verbreel-runtime",
    "verbreel-runtime/native-render",
]

[dependencies]
verbreel-agent = { path = "../verbreel-agent" }
verbreel-state = { path = "../verbreel-state" }
verbreel-storage = { path = "../verbreel-storage" }
verbreel-runtime = { path = "../verbreel-runtime", optional = true }
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
# `Router::oneshot` integration tests collect response bodies with
# `BodyExt::collect()` — that lives in `http-body-util`, which is a
# direct dep of axum but is not re-exported from the public surface.
http-body-util = "0.1"
tower.workspace = true
tempfile.workspace = true
