[package]
name = "verbreel-mcp"
description = "MCP stdio server — rmcp ServerHandler."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "verbreel_mcp"
path = "src/lib.rs"

[[bin]]
name = "verbreel-mcp"
path = "src/main.rs"

[dependencies]
verbreel-state = { path = "../verbreel-state" }
verbreel-storage = { path = "../verbreel-storage" }
verbreel-runtime = { path = "../verbreel-runtime", optional = true }
tokio.workspace = true
rmcp.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[features]
default = []
native-render = [
    "dep:verbreel-runtime",
    "verbreel-runtime/native-render",
]

[dev-dependencies]
# Tests build an Engine over a TempDir home so each gets an isolated
# .verbreel/projects-index.
tempfile.workspace = true
# server_e2e.rs drives the ServerHandler trait end-to-end over an
# in-process tokio::io::duplex pipe: a real rmcp client (client feature)
# on one half, VerbreelServer.serve() on the other. Peer::new is
# pub(crate) in rmcp 1.7, so a live duplex client is the only way to
# build the RequestContext those trait methods require.
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
